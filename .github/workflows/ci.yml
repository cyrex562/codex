name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gate 1: Rust lint ───────────────────────────────────────────────────────
  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Gate 2: Rust unit tests ────────────────────────────────────────────────
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unlike `lint` (clippy defaults to `default-members` = librarium-server
      # only, per the root Cargo.toml) and `backend-integration` (`-p
      # librarium-server` only), this job's `--workspace` flag below also
      # compiles librarium-tauri, which needs GTK/WebKit2GTK dev headers for
      # its tray-icon/webview dependencies (gtk-sys, webkit2gtk-sys) — the
      # same packages release.yml's desktop-linux job installs to actually
      # build the desktop bundle.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Run all Rust tests (unit + integration)
        run: cargo test --workspace
        env:
          RUST_LOG: debug

  # ── Gate 2b: Backend integration tests (explicit suite) ────────────────────
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config
      - name: Run backend integration tests
        run: |
          cargo test -p librarium-server \
            --test api_integration \
            --test entity_api_tests \
            --test import_archive_tests \
            --test auth_group_sharing \
            --test ws_authorization_tests \
            --test oidc_state_tests \
            -- --nocapture
        env:
          RUST_LOG: debug

  # ── Gate 2c: Mobile contract test (server routes vs local dispatcher, #59) ─
  # Runs `librarium-mobile`'s `contract_test.rs`, which spins up a real
  # in-process `librarium-server` and asserts every #56/#57 route produces a
  # structurally equivalent response from the `librarium-mobile` functions
  # that back `localDispatcher.ts`. Its own gate (rather than folded into
  # `rust-test`'s `--workspace` run, which also executes it) so a route drift
  # between the two implementations is unambiguous in the check list, not
  # buried in a general test failure.
  contract-test:
    name: Mobile contract test (server routes vs local dispatcher)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config
      - name: Run contract test suite
        run: cargo test -p librarium-mobile --test contract_test -- --nocapture
        env:
          RUST_LOG: debug

  # ── Gate 2d: Android cross-compile (catches C-toolchain regressions) ───────
  # Builds librarium-core + librarium-sync + librarium-mobile — the crates a
  # future thin mobile client depends on — for both Android ABIs.
  # librarium-server is deliberately excluded: it's not expected to run on
  # mobile, so cross-compiling it here would prove nothing this job cares
  # about.
  #
  # This is the gate that keeps #47's fix (dropping openssl-sys and onig, the
  # two native C dependencies that block an Android cross-compile) from
  # silently regressing while Route C's later phases are in flight. The
  # explicit `cargo tree -i` check below is the actual gate, not the build
  # step: onig_sys/openssl-sys vendor their own C sources and can cross-
  # compile successfully given a working target C compiler (which cargo-ndk
  # provides), so a reintroduced dependency would NOT reliably fail the build
  # — it has to be caught by asserting it isn't in the tree at all.
  #
  # Relies on the Android SDK/NDK already bundled on GitHub's `ubuntu-latest`
  # runner image (exposed via $ANDROID_HOME); cargo-ndk auto-detects the NDK
  # from there, so no explicit NDK install step is needed. If a future runner
  # image ever drops the bundled NDK, add an `android-actions/setup-android`
  # (or nttld/setup-ndk) step here.
  android-cross-compile:
    name: Android cross-compile (librarium-core + librarium-sync + librarium-mobile)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-cross-compile
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Verify no C-toolchain dependencies re-entered (openssl-sys, onig)
        run: |
          set -e
          for target in aarch64-linux-android x86_64-linux-android; do
            for pkg in openssl-sys onig; do
              if cargo tree -p librarium-core -p librarium-sync -p librarium-mobile --target "$target" -i "$pkg" > /dev/null 2>&1; then
                echo "::error::$pkg re-entered the librarium-core/librarium-sync/librarium-mobile dependency tree for $target — this reintroduces the C-toolchain blocker fixed in #47 (see docs/DESIGN.md or issue #47)."
                exit 1
              fi
            done
          done
      - name: Cross-compile for aarch64-linux-android (arm64-v8a)
        run: cargo ndk -t aarch64-linux-android -P 21 build -p librarium-core -p librarium-sync -p librarium-mobile
      - name: Cross-compile for x86_64-linux-android (emulator ABI)
        run: cargo ndk -t x86_64-linux-android -P 21 build -p librarium-core -p librarium-sync -p librarium-mobile

  # ── Gate 3: Frontend unit tests (Vitest) ───────────────────────────────────
  vitest:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Gate 4: Playwright E2E — chromium + firefox + webkit ───────────────────
  e2e:
    name: Playwright E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [rust-test, backend-integration, vitest]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      # Cache Playwright browser binaries keyed by browser + package-lock.json so
      # the ~200 MB download is only repeated when the Playwright version changes.
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browser + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build server
        working-directory: .
        run: cargo build -p librarium-server
      - name: Start librarium-server in background
        working-directory: .
        run: |
          mkdir -p /tmp/librarium-e2e
          cat > /tmp/librarium-e2e/config.toml <<'EOF'
          [server]
          host = "127.0.0.1"
          port = 4173

          [database]
          path = "/tmp/librarium-e2e/librarium.db"
          EOF
          ./target/debug/librarium-server --config /tmp/librarium-e2e/config.toml &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait for the health endpoint to come up (max 30s).
          for i in $(seq 1 300); do
            if curl -sf http://127.0.0.1:4173/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i} attempts"
              break
            fi
            sleep 0.1
          done
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          PLAYWRIGHT_INCLUDE_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

  # ── WebKitGTK 2.36 compatibility gate ──────────────────────────────────────
  webkit-compat:
    name: WebKitGTK 2.36 compat (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    needs: [rust-test, backend-integration, vitest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Ubuntu 22.04)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Cache Playwright browser binaries (webkit / Ubuntu 22.04)
        uses: actions/cache@v4
        id: playwright-cache-webkit-22
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-22.04-webkit-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright webkit browser + system deps (cache miss)
        if: steps.playwright-cache-webkit-22.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - name: Install Playwright webkit system deps only (cache hit)
        if: steps.playwright-cache-webkit-22.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - name: Build frontend
        run: npm run build
      - name: Build server
        working-directory: .
        run: cargo build -p librarium-server
      - name: Start librarium-server in background
        working-directory: .
        run: |
          mkdir -p /tmp/librarium-e2e
          cat > /tmp/librarium-e2e/config.toml <<'EOF'
          [server]
          host = "127.0.0.1"
          port = 4173

          [database]
          path = "/tmp/librarium-e2e/librarium.db"
          EOF
          ./target/debug/librarium-server --config /tmp/librarium-e2e/config.toml &
          for i in $(seq 1 300); do
            if curl -sf http://127.0.0.1:4173/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i} attempts"
              break
            fi
            sleep 0.1
          done
      - name: Run Playwright tests on webkit (WebKitGTK 2.36 baseline)
        run: npx playwright test --project=webkit
        env:
          CI: true
          PLAYWRIGHT_INCLUDE_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-webkit-gtk-2.36
          path: frontend/playwright-report/
          retention-days: 14
