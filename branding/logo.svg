<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Librarium">
  <title>Librarium</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b313c"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <clipPath id="round"><rect width="100" height="100" rx="22.5" ry="22.5"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="100" height="100" fill="url(#tile)"/>

    <!-- knowledge graph: edges (round caps) drawn first, book plugs into their ends -->
    <g fill="none" stroke="#eef1f6" stroke-width="2.1" stroke-linecap="round">
      <line x1="50" y1="63.2" x2="50" y2="22.5"/>
      <line x1="50" y1="22.5" x2="26.5" y2="36.5"/>
      <line x1="50" y1="22.5" x2="73.5" y2="36.5"/>
      <line x1="26.5" y1="36.5" x2="33" y2="61.5"/>
      <line x1="73.5" y1="36.5" x2="67" y2="61.5"/>
    </g>

    <!-- open book -->
    <polygon points="17,57.5 50,63.8 83,57.5 83,70 50,75.5 17,70" fill="#eef1f6"/>
    <!-- spine fold -->
    <line x1="50" y1="64.2" x2="50" y2="75.2" stroke="#1b1e25" stroke-width="1.3" stroke-linecap="round"/>

    <!-- graph nodes -->
    <circle cx="50" cy="22.5" r="5.5" fill="#eef1f6"/>
    <circle cx="26.5" cy="36.5" r="4.3" fill="#eef1f6"/>
    <circle cx="73.5" cy="36.5" r="4.3" fill="#eef1f6"/>
    <circle cx="50" cy="63.2" r="2.4" fill="#eef1f6"/>
  </g>
</svg>
